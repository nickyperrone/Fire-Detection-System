[project]
name = "field-watch"
version = "0.1.0"
description = "Fire, spray and field anomaly monitoring for crop-spraying contractors"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "httpx>=0.27",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rasterio>=1.5.1,<1.5.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mapbox-vector-tile>=2.2.0",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs the PostGIS database from docker compose"]
