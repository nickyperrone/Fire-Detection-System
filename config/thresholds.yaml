# Every value here is hashed into processing_version (docs/02-architecture.md#processing-version).
# Changing any of them changes the version stored on new derived rows.

region:
  name: entre-rios-delta
  # west, south, east, north (EPSG:4326). Entre Ríos and the Paraná Delta: the fields near
  # Larroque plus the area shown in explore mode and used to train the fire forecast.
  bbox: [-61.0, -34.5, -57.5, -30.0]

territories:
  # A section may stick out of its field by this much, to absorb drawing and simplification error.
  section_tolerance_m: 5

firms:
  # FIRMS Landsat detections only cover the US and Canada.
  products: [VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT, VIIRS_SNPP_NRT, MODIS_NRT]
  day_range: 2
  dedup_coordinate_decimals: 4
  modis_confidence:
    nominal_from: 30
    high_from: 80

correlation:
  rule: spatiotemporal_v1
  max_distance_m: 1000
  max_time_gap_hours: 24
  stale_after_hours: 48

field_risk:
  # Ordered from closest to farthest; distance 0 means the fire intersects the territory.
  bands:
    - {severity: CRITICAL, max_distance_m: 0}
    - {severity: VERY_HIGH, max_distance_m: 2000}
    - {severity: HIGH, max_distance_m: 5000}
    - {severity: WATCH, max_distance_m: 10000}

weather:
  forecast_hours: 48
  # Field centroids are rounded to this grid so nearby fields share one forecast point.
  grid_degrees: 0.02

spray:
  profiles:
    default:
      wind_kmh: {min: 3, caution_from: 13, max: 15}
      gusts_kmh: {caution_from: 17, max: 20}
      delta_t_c: {min: 2, caution_from: 8, max: 10}
      temperature_c: {caution_from: 28, max: 30}
      rain:
        lookahead_hours: 2
        max_mm: 0.2
        caution_probability_pct: 50
      inversion:
        max_wind_kmh: 5
        max_cloud_cover_pct: 30
        hours_after_sunrise: 2

data_quality:
  fire_stale_after_hours: 12
  weather_stale_after_hours: 3

worker:
  # FIRMS allows 5,000 requests per 10 minutes per key; one run makes 4.
  fire_interval_minutes: 5
  weather_interval_minutes: 60
