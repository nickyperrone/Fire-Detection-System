# Every value here is hashed into processing_version (docs/02-architecture.md#processing-version).
# Changing any of them changes the version stored on new derived rows.

region:
  name: entre-rios-delta
  # west, south, east, north (EPSG:4326). Entre Ríos and the Paraná Delta: the fields near
  # Larroque plus the area shown in explore mode and used to train the fire forecast.
  bbox: [-61.0, -34.5, -57.5, -30.0]

territories:
  # A section may stick out of its field by this much, to absorb drawing and simplification error.
  section_tolerance_m: 5
  # Fields must lie inside this boundary, give or take the tolerance.
  allowed_area: data/boundaries/argentina.geojson
  allowed_area_tolerance_m: 1000

static_sources:
  # Archive "type" codes that mark a source hot every day (2: industry, gas flares).
  types: [2]
  grid_degrees: 0.005
  radius_m: 1000

static_sources:
  # Archive "type" codes that mark a source hot every day (2: industry, gas flares).
  types: [2]
  grid_degrees: 0.005
  radius_m: 1000

cadastre:
  # docs/08-cadastre.md. Parcels load per zoom-13 tile, on first view.
  tile_zoom: 13
  refresh_days: 90
  snap:
    parcel_cover_share: 0.5
    max_shape_change: 0.35
    edge_tolerance_m: 30
    # Gaps up to twice this (roads between parcels) are closed in a parcel union.
    close_gaps_m: 20
  # `format` picks how the province's fields are read (providers/cadastre_wfs.py).
  sources:
    - province: Entre Ríos
      bbox: [-60.85, -34.1, -57.75, -30.1]
      wfs_url: https://geoserver.ater.gob.ar/geoserver/sit_catastro/ows
      layer: sit_catastro:vwm_parcelario_base
      format: ater
      sort_by: partida
      page_size: 1000
    - province: Buenos Aires
      bbox: [-63.4, -41.1, -56.6, -33.2]
      wfs_url: https://geo.arba.gov.ar/geoserver/idera/wfs
      layer: idera:Parcela
      format: arba
      sort_by: pda
      page_size: 1000
    - province: Córdoba
      bbox: [-65.8, -35.0, -61.7, -29.5]
      wfs_url: https://idecor-ws.mapascordoba.gob.ar/geoserver/idecor/wfs
      layer: idecor:parcelas
      format: idecor
      sort_by: id
      page_size: 1000

firms:
  # FIRMS Landsat detections only cover the US and Canada.
  products: [VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT, VIIRS_SNPP_NRT, MODIS_NRT]
  day_range: 2
  dedup_coordinate_decimals: 4
  modis_confidence:
    nominal_from: 30
    high_from: 80

correlation:
  rule: spatiotemporal_v1
  # By source of the new observation: GOES pixels are about 2 x 3 km over Entre Ríos.
  max_distance_m:
    firms: 1000
    goes: 3000
  max_time_gap_hours: 24
  stale_after_hours: 48

goes:
  bucket: noaa-goes19
  fire_product: ABI-L2-FDCF
  lightning_product: GLM-L2-LCFA
  # Codes of the ABI fire mask; 30-35 are the same classes after the temporal filter.
  fire_mask_confidence:
    high: [10, 11, 13, 30, 31, 33]
    nominal: [12, 14, 32, 34]
    low: [15, 35]
  min_confidence: nominal

lightning:
  radius_m: 10000
  window_minutes: 60
  keep_days: 7

history:
  # FIRMS yearly country archive (docs/07-fire-history.md).
  url: https://firms.modaps.eosdis.nasa.gov/data/country/{product}/{year}/{product}_{year}_{country}.csv
  product: viirs-snpp
  country: Argentina
  first_year: 2015
  last_year: 2024
  # Archive "type": 0 vegetation fire; 1 volcano, 2 static land source, 3 offshore are dropped.
  keep_types: [0]
  radius_m: 10000
  cache_dir: data/cache/firms-archive

forecast:
  # docs/05-fire-forecast.md
  cell_degrees: 0.1
  weather_degrees: 0.5
  weather_url: https://power.larc.nasa.gov/api/temporal/daily/point
  weather_cache_dir: data/cache/nasa-power
  first_year: 2015
  last_year: 2024
  train_years: [2015, 2021]
  validation_years: [2022, 2023]
  test_years: [2024, 2024]
  horizons_days: [1, 2, 3]
  rain_day_mm: 5
  model_dir: data/models
  report: docs/reports/fire-forecast.md
  radius_m: 10000
  # Next-day probability for a field; first cut (docs/05-fire-forecast.md#bands-and-factors).
  bands:
    - {band: VERY_HIGH, from: 0.35}
    - {band: HIGH, from: 0.15}
    - {band: MODERATE, from: 0.05}
    - {band: LOW, from: 0.0}
  factors:
    dry_air_rh_pct: 35
    no_rain_days: 10
    hot_c: 32
    high_fwi: 20
    recent_cell_fire_days: 30
    burning_month_rate: 1.0
  live_weather:
    open_meteo_url: https://api.open-meteo.com/v1/forecast
    past_days: 30
    bias_min_days: 7
  recent_fires:
    api_url: https://firms.modaps.eosdis.nasa.gov/api/area/csv/{key}/{product}/{bbox}/{days}/{date}
    standard_product: VIIRS_SNPP_SP
    near_real_time_product: VIIRS_SNPP_NRT
    days_per_request: 5

field_risk:
  # Ordered from closest to farthest; distance 0 means the fire intersects the territory.
  bands:
    - {severity: CRITICAL, max_distance_m: 0}
    - {severity: VERY_HIGH, max_distance_m: 2000}
    - {severity: HIGH, max_distance_m: 5000}
    - {severity: WATCH, max_distance_m: 10000}

weather:
  forecast_hours: 48
  # Field centroids are rounded to this grid so nearby fields share one forecast point.
  grid_degrees: 0.02

spray:
  profiles:
    default:
      wind_kmh: {min: 3, caution_from: 13, max: 15}
      gusts_kmh: {caution_from: 17, max: 20}
      delta_t_c: {min: 2, caution_from: 8, max: 10}
      temperature_c: {caution_from: 28, max: 30}
      rain:
        lookahead_hours: 2
        max_mm: 0.2
        caution_probability_pct: 50
      inversion:
        max_wind_kmh: 5
        max_cloud_cover_pct: 30
        hours_after_sunrise: 2

data_quality:
  fire_stale_after_hours: 12
  weather_stale_after_hours: 3
  # GLM publishes every 20 s; 10 minutes without a file means the feed stopped.
  lightning_stale_after_minutes: 10

worker:
  # FIRMS allows 5,000 requests per 10 minutes per key; one run makes 4.
  fire_interval_minutes: 5
  goes_fire_interval_minutes: 5
  lightning_interval_minutes: 1
  forecast_interval_minutes: 60
  weather_interval_minutes: 60

# Sign-in by email link and email alerts (docs/09-accounts-and-alerts.md).
auth:
  link_minutes: 15
  session_days: 30
  login_links_per_hour: 5

alerts:
  # A field gets at most one lightning email in this time, however long the storm lasts.
  lightning_quiet_minutes: 60

# Field outlines by computer vision (docs/10-field-detection.md).
field_detection:
  window_m: 4000
  pixels: 400
  months: 12
  max_scene_cloud_percent: 10
  max_window_cloud_share: 0.05
  smoothing_sigma: 0.7
  # Root mean square NDVI difference between a pixel's year and the tap's, to be the same field.
  similarity: 0.1
  opening_px: 2
  simplify_m: 10
  read_threads: 4
  cache_days: 7
  # Benchmark: a parcel counts as one field when this share of it has the same history.
  benchmark_purity: 0.8
