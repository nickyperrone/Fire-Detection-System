services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fieldwatch
      POSTGRES_PASSWORD: fieldwatch
      POSTGRES_DB: fieldwatch
    # 5433 so it does not collide with a local Postgres on 5432.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldwatch"]
      interval: 3s
      retries: 20

  # Catches every email in development; read them at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://fieldwatch:fieldwatch@db:5432/fieldwatch
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      THRESHOLDS_PATH: /config/thresholds.yaml
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-Field Watch <alerts@fieldwatch.local>}
    volumes: ["./config:/config:ro"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: ./backend
    command: python -m app.worker
    environment: *app_env
    volumes: ["./config:/config:ro"]
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
